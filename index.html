<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Trades</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
</head>
<body>
  <!-- Top Nav -->
  <nav class="topnav">
    <div class="nav-left">
      <span class="logo">⚡ Claude Trades</span>
      <span class="chain-badge">◎ SOL</span>
    </div>
    <div class="nav-right">
      <div class="paper-balance">
        <span class="balance-label">Paper Balance</span>
        <span class="balance-amount" id="paperBalance">◎ 100.00</span>
      </div>
      <div class="pnl-display">
        <span class="pnl-label">P&amp;L</span>
        <span class="pnl-amount" id="pnlDisplay">+◎ 0.00</span>
      </div>
      <button class="reset-btn" onclick="resetPaperTrading()">Reset</button>
    </div>
  </nav>

  <!-- Main Layout -->
  <div class="main-layout">

    <!-- Final Stretch Column -->
    <div class="column" id="col-finalstretch">
      <div class="col-header">
        <div class="col-title">
          <span class="col-icon">🏁</span>
          <span>Final Stretch</span>
          <span class="col-subtitle">above 10k · near bonding curve</span>
        </div>
        <div class="col-meta">
          <span class="live-dot"></span>
          <span class="live-label">LIVE</span>
        </div>
      </div>
      <div class="token-list" id="finalStretchList"></div>
    </div>

    <!-- Migrated Column -->
    <div class="column" id="col-migrated">
      <div class="col-header">
        <div class="col-title">
          <span class="col-icon">🚀</span>
          <span>Migrated</span>
          <span class="col-subtitle">graduated · on-chain DEX</span>
        </div>
        <div class="col-meta">
          <span class="live-dot"></span>
          <span class="live-label">LIVE</span>
        </div>
      </div>
      <div class="token-list" id="migratedList"></div>
    </div>

  </div>

  <!-- Chart Modal -->
  <div class="modal-overlay" id="chartModal" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-token-info">
          <div class="modal-icon" id="modalIcon"></div>
          <div>
            <div class="modal-name" id="modalName"></div>
            <div class="modal-symbol" id="modalSymbol"></div>
          </div>
          <div class="modal-price-block">
            <span class="modal-price" id="modalPrice"></span>
            <span class="modal-change" id="modalChange"></span>
          </div>
        </div>
        <button class="modal-close" onclick="closeChart()">✕</button>
      </div>

      <div class="modal-stats">
        <div class="stat-item"><span class="stat-label">Market Cap</span><span class="stat-val" id="modalMcap"></span></div>
        <div class="stat-item"><span class="stat-label">Volume 24h</span><span class="stat-val" id="modalVol"></span></div>
        <div class="stat-item"><span class="stat-label">Holders</span><span class="stat-val" id="modalHolders"></span></div>
        <div class="stat-item"><span class="stat-label">Age</span><span class="stat-val" id="modalAge"></span></div>
        <div class="stat-item"><span class="stat-label">Txns</span><span class="stat-val" id="modalTxns"></span></div>
        <div class="stat-item"><span class="stat-label">Buys/Sells</span><span class="stat-val" id="modalBuySell"></span></div>
      </div>

      <div class="chart-container">
        <canvas id="priceChart"></canvas>
      </div>

      <!-- Paper Trading Panel -->
      <div class="trade-panel">
        <div class="trade-tabs">
          <button class="trade-tab active" id="tabBuy" onclick="switchTab('buy')">Buy</button>
          <button class="trade-tab" id="tabSell" onclick="switchTab('sell')">Sell</button>
        </div>
        <div class="trade-body">
          <div class="trade-info-row">
            <span>Available: <strong id="availableBalance"></strong></span>
            <span>Holdings: <strong id="tokenHoldings"></strong></span>
          </div>
          <div class="quick-amounts" id="quickAmounts">
            <button onclick="setAmount(0.1)">0.1 ◎</button>
            <button onclick="setAmount(0.5)">0.5 ◎</button>
            <button onclick="setAmount(1)">1 ◎</button>
            <button onclick="setAmount(5)">5 ◎</button>
          </div>
          <div class="trade-input-row">
            <input type="number" id="tradeAmount" placeholder="Amount (SOL)" min="0.01" step="0.01" />
            <button class="exec-btn buy-btn" id="execBtn" onclick="executeTrade()">Buy</button>
          </div>
          <div class="trade-result" id="tradeResult"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
